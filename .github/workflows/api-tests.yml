name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger; the job only runs when main is selected

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TENANTID: ${{ secrets.TENANTID }}
      USERTYPE: ${{ secrets.USERTYPE }}
      CLIENT_AUTH_HEADER: ${{ secrets.CLIENT_AUTH_HEADER }}
      SEARCH_LIMIT: ${{ secrets.SEARCH_LIMIT }}
      SEARCH_OFFSET: ${{ secrets.SEARCH_OFFSET }}
      HIERARCHYTYPE: ${{ secrets.HIERARCHYTYPE }}
      BOUNDARY_TYPE: ${{ secrets.BOUNDARY_TYPE }}
      BOUNDARY_CODE: ${{ secrets.BOUNDARY_CODE }}
      SERVICE_INDIVIDUAL: ${{ secrets.SERVICE_INDIVIDUAL }}
      SERVICE_PROJECT: ${{ secrets.SERVICE_PROJECT }}
      SERVICE_MDMS: ${{ secrets.SERVICE_MDMS }}
      SERVICE_HRMS: ${{ secrets.SERVICE_HRMS }}
      SERVICE_PGR: ${{ secrets.SERVICE_PGR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output reports

      - name: Verify login credentials
        timeout-minutes: 6
        run: |
          python - <<'PY'
          import sys, time
          import requests
          from utils.auth import oauth_token

          # Retry so a brief server outage does not cancel the whole run.
          # Each attempt is capped by utils.auth.LOGIN_TIMEOUT.
          attempts = 4
          for attempt in range(1, attempts + 1):
              try:
                  r = oauth_token()
              except requests.RequestException as exc:
                  print(f"Attempt {attempt}/{attempts}: BASE_URL unreachable ({type(exc).__name__})")
              else:
                  if r.status_code == 200 and "access_token" in r.text:
                      print("Login OK")
                      sys.exit(0)
                  if r.status_code in (400, 401):
                      print(f"::error::Login rejected (HTTP {r.status_code}). Check the USERNAME/PASSWORD/TENANTID/USERTYPE repo secrets.")
                      sys.exit(1)
                  print(f"Attempt {attempt}/{attempts}: login returned HTTP {r.status_code}")
              if attempt < attempts:
                  time.sleep(20)
          print("::error::BASE_URL did not respond to login after several attempts. The test server looks down; re-run once it is back.")
          sys.exit(1)
          PY

      - name: Run API tests
        run: |
          pytest tests/ -v --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml || true

      - name: Copy output files to reports
        if: always()
        run: |
          cp -r output/* reports/ 2>/dev/null || true

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30

      - name: Upload test results to GitHub
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-results
          path: reports/junit.xml

      - name: Publish Test Results to Summary
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: reports/junit.xml
          reporter: java-junit
